<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScanVision — Demonstração da API /detect</title>
<style>
body{font-family:sans-serif;max-width:800px;margin:40px auto;padding:0 20px;background:#f8f9fa;color:#212529}
h1{color:#198754}
form{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input[type="file"]{margin-top:10px}
button{margin-top:15px;padding:10px 24px;border:none;border-radius:6px;background:#198754;color:#fff;font-weight:600;cursor:pointer}
pre{background:#212529;color:#d4d4d4;padding:16px;border-radius:10px;overflow-x:auto;font-size:13px}
.result{margin-top:24px;padding:16px;background:#fff;border-left:6px solid #198754;border-radius:8px}
</style>
</head>
<body>
<h1>ScanVision — Demonstração da API /detect</h1>
<p>Envie uma imagem de supermercado para ver o JSON estruturado retornado pela API FastAPI.</p>

<form id="form" onsubmit="event.preventDefault(); sendImage();">
  <label><strong>Imagem (JPEG/PNG):</strong><br>
    <input type="file" id="file" accept=".jpg,.jpeg,.png" required>
  </label><br>
  <button type="submit">Enviar para /detect</button>
</form>

<div class="result" id="result" style="display:none;">
  <h2>Resposta JSON</h2>
  <pre id="json">...</pre>
</div>

<script>
async function sendImage() {
  const file = document.getElementById('file').files[0];
  if (!file) return alert('Selecione uma imagem');
  const fd = new FormData();
  fd.append('file', file);
  document.getElementById('result').style.display = 'none';
  try {
    const res = await fetch('http://localhost:8000/detect', {method:'POST', body: fd});
    const data = await res.json();
    document.getElementById('json').textContent = JSON.stringify(data, null, 2);
    document.getElementById('result').style.display = 'block';
  } catch (e) {
    alert('Erro ao chamar API (verifique se uvicorn está rodando em localhost:8000)');
  }
}
</script>

<hr>
<p><small>Projeto Final — Módulo 2 SCTEC | Repositório: <a href="https://github.com/RSC-SC/Projeto-Final-Modulo-2">GitHub</a> | Kanban: <a href="https://github.com/users/RSC-SC/projects/8">Project</a></small></p>
</body>
</html>
